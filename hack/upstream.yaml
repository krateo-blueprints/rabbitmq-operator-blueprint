# The upstream releases this repository vendors, one entry per chart. Every gate and the release preflight read this
# file: it is the one place a version is bumped (docs/release.md, "Bumping an upstream version").
#   chart      the blueprint directory under blueprints/ (chart in chart/, CompositionDefinition beside it)
#   repo       the upstream GitHub repository
#   tag        the upstream release tag
#   asset      the release asset vendored, unchanged, at blueprints/<chart>/chart/files/upstream/<asset>
#   sha256     the asset's digest, as the release served it when it was vendored
#   image      the operator image that release deploys (repository, without tag)
#   container  the operator container in its Deployment
#   requires   the CustomResourceDefinitions the chart refuses to render without, on a live cluster
upstreams:
  - chart: rabbitmq-cluster-operator
    repo: rabbitmq/cluster-operator
    tag: v2.23.2
    asset: cluster-operator.yml
    sha256: 58b74bd515767123c3ba3bcdd01016e808565c93fda501eb4f05679bf4dc773f
    image: ghcr.io/rabbitmq/cluster-operator
    container: operator
    requires:
      - certificates.cert-manager.io
      - issuers.cert-manager.io
  - chart: rabbitmq-topology-operator
    repo: rabbitmq/messaging-topology-operator
    tag: v1.20.5
    asset: messaging-topology-operator-with-certmanager.yaml
    sha256: 01c8487002d027415f54bdf5d3ca030f3e78a7d2d38e596057e9a625a0009029
    image: ghcr.io/rabbitmq/messaging-topology-operator
    container: manager
    requires:
      - certificates.cert-manager.io
      - issuers.cert-manager.io
      - rabbitmqclusters.rabbitmq.com
