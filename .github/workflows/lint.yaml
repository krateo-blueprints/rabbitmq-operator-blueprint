name: lint

# The gates of this repository. release-tag.yaml refuses a commit with no successful run of this workflow
# (krateo-blueprints/charts PUBLISHING.md rule 10), and a release tags a commit on main, which a pull_request run never
# covers, so it also runs on pushes to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by
  # commit SHA with a version comment. The shared check refuses any that is not.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@3ff640fd0dbef64c29b7a63a88b98da7f99e8052 # 1.0.1

  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Every gate exits 2 when PyYAML is missing, so a lost install fails the job instead of skipping it.
      - name: Install PyYAML
        run: pip install "PyYAML==6.0.2"

      # The vendored release manifests are byte for byte the upstream assets: the recorded digest, and (live) what
      # GitHub serves for the pinned tag today.
      - name: Each chart vendors its upstream release manifest unchanged
        run: python3 hack/validate-vendored.py . --live

      # appVersion, the image, the krateo.io/upstream annotation, the CompositionDefinitions, the required CRDs and the
      # examples agree with hack/upstream.yaml and with each other.
      - name: Every version names the same upstream release
        run: python3 hack/validate-version-mirror.py .

      # The render is upstream with exactly the documented changes; HA defaults; the cert-manager and RabbitmqCluster
      # refusals, driven with stand-in CRD lookups.
      - name: Each chart renders upstream with only the documented changes, and refuses without its CRDs
        run: python3 hack/validate-render.py .

      # The reusable release preflight runs first and gates the push; the hook refuses what it must.
      - name: The release runs this repository's preflight before publishing anything
        run: python3 hack/validate-release-wiring.py .

      # prerelease.yaml: dispatch only, contents: read + packages: write, no reusable workflow or index step, the
      # pre-release shape checked before push; the version scripts' table, derive and loosened copies.
      - name: A pre-release reaches GHCR only, and a release is never a pre-release version
        run: python3 hack/validate-prerelease-channel.py .

      # charts PUBLISHING.md rule 14: no bare `helm push` / `oras push` in any workflow; the organisation's chart-push
      # action pinned by commit; locate mode wired to its path output. The script's own cases and mutants live with it,
      # in krateo-platformops/.github (.github/actions/chart-push/push_test.py).
      - name: Charts are pushed only through krateo-platformops/.github's chart-push, pinned by commit
        run: python3 hack/validate-chart-push.py .

      - name: Repository-authored YAML is block style only
        run: python3 hack/validate-yaml-block-style.py .

      - name: helm lint every chart
        run: |
          set -euo pipefail
          for c in blueprints/*/chart; do
            sed -i "s/CHART_VERSION/0.0.0-ci/g" "$c/Chart.yaml"
            helm lint "$c"
          done
